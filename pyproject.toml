[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casbot02-mjlab"
version = "0.1.0"
description = "CASBOT02 locomotion teacher training and MuJoCo sim2sim"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mjlab",
  "torch==2.8.0",
  "mujoco==3.8.1",
  "rsl-rl-lib==5.2.0",
  "onnx==1.21.0",
  "numpy==1.26.4",
  "tensordict==0.11.0",
  "tyro==1.0.12",
  "tensorboard==2.20.0",
  "onnxscript==0.6.2",
  "warp-lang==1.12.0",
  "viser==1.0.29",
]

[project.optional-dependencies]
sim2sim = ["onnxruntime==1.23.2", "mujoco-python-viewer==0.1.4"]

[project.entry-points."mjlab.tasks"]
wbc_mjlab = "wbc_mjlab"

[dependency-groups]
dev = ["pytest>=9.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wbc_mjlab = ["CASBOT02_7dof/xml/*.xml", "CASBOT02_7dof/meshes/*.STL"]

[tool.uv]
override-dependencies = ["mujoco==3.8.1"]

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab", tag = "v1.4.0" }
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

